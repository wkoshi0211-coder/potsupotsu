<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#315c6a"><meta name="apple-mobile-web-app-capable" content="yes"><title>ぽつぽつ — なぞるひらがな</title><link rel="stylesheet" href="style.css"><body>
<header><a href="./" class="brand"><b>⠿</b> ぽつぽつ <small>なぞる、ひとやすみ。</small></a><button id="settings">設定 ⚙</button></header><main><div class="heading"><div><small>ゆびで、ゆっくり。</small><h1>さわって、なぞって。</h1><p>ひとつずつでも、つなげても。</p></div><div class="letter"><small>いまの もじ</small><strong id="current">あ</strong></div></div>
<section class="play"><canvas id="board" aria-label="小さなイラストを指でタッチ、またはなぞってください"></canvas><div class="caption"><span id="modeLabel">ふうせん</span><span id="status" aria-live="polite">さわると、くもにかわるよ</span></div><div id="paused" hidden>ひとやすみ中<button id="resume">つづける</button></div></section>
<div class="toolbar"><div class="themes" role="group" aria-label="イラスト"><button data-theme="balloon" aria-pressed="true"><span>🎈</span>ふうせん</button><button data-theme="bee" aria-pressed="false"><span>🐝</span>はち</button><button data-theme="butterfly" aria-pressed="false"><span>🦋</span>ちょうちょ</button></div><button id="next" class="next">つぎへ　 →</button></div><footer><span>じぶんのペースで、だいじょうぶ。</span><button id="pause">Ⅱ ひとやすみ</button></footer></main>
<dialog id="dialog"><form method="dialog"><div class="dialogHead"><h2>設定</h2><button aria-label="設定を閉じる">✕</button></div><p>変更はこのブラウザに保存されます。</p><label>イラストの切り替え<select id="autoTheme"><option value="manual">選んだイラストを使う</option><option value="random">文字ごとにランダム</option></select></label><label>対象の細かさ<select id="density"><option value="normal">ふつう</option><option value="fine">こまかい</option></select></label><label>動き<select id="motion"><option value="on">短いエフェクト</option><option value="off">動きを控える</option></select></label><p>基本のひらがな46文字を、重複しない順でランダムに提示します。音・制限時間・得点はありません。</p><button class="next close">とじる</button></form></dialog><script src="app.js"></script></body></html>
